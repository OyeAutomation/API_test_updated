profiles:
  - name: default
    algorithm: AES-256-CBC
    key_derivation: PBKDF2HMAC
    hash: SHA256
    iterations: 10000
    key: "my-secret-api-key-12345"
    key_encoding: utf8
    salt: "fixed-salt-value"
    salt_encoding: utf8
    iv: random
    iv_encoding: utf8
    prepend_iv_to_output: true
    output_encoding: base64
